appId: cc.sunglint.weekclip
name: skeleton-smoke
tags:
  - smoke
---
# The app launches, renders its start destination, and completes one full pass
# through the spine. A Hilt or Compose wiring mistake fails here and nowhere in
# the unit tests, which never construct the Activity.
- launchApp:
    clearState: true

# By id, not by copy — `screen-title` is a testTag, exposed as a resource-id by
# the testTagsAsResourceId opt-in in WeekclipApp. This assertion is also what
# proves that opt-in still works: drop it and the selector silently matches
# nothing.
- assertVisible:
    id: "screen-title"

# By text, because the start destination is a contract: WeekclipRoutes.DASHBOARD
# is where deep links land (PRD-0008 D4).
- assertVisible: "Studios"

# The real claim. `dashboard-loading` is the initial state, so its *disappearance*
# means DashboardViewModel was constructed by Hilt, GetStudiosUseCase ran, the
# repository answered, and the new state reached Compose. Whether the answer was
# a list or an error does not matter here — both clear `isLoading`, and which one
# you get depends on whether this machine can reach the WAF-gated dev API. This
# flow asserts the spine, not the network.
- extendedWaitUntil:
    notVisible:
      id: "dashboard-loading"
    timeout: 15000

- takeScreenshot: dashboard
