name: Android CI

# This workflow had never produced a green run before 2026-08-14 (#148).
# The previous version ran `chmod +x gradlew` against a repo that had no Gradle
# wrapper, so every run died in ~16s, and its second job ran
# `./gradlew ktlintCheck || true` with no ktlint plugin applied — pure theatre.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Maestro flows cannot RUN here — that needs a device, and the flows exist to
  # be run against real hardware (maestro/README.md explains why the dev Mac's
  # emulator is unusable). What CI can do is catch a flow that would have died
  # on a typo, which is the failure mode that wastes a human's device session.
  # It is a real check: `check-syntax` exits 1 on an unknown command.
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Check flow syntax
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          shopt -s nullglob
          flows=(maestro/*.yaml)
          if [ ${#flows[@]} -eq 0 ]; then
            echo "no flows found under maestro/ — this job would pass vacuously" >&2
            exit 1
          fi
          for f in "${flows[@]}"; do
            echo "== $f"
            maestro check-syntax "$f"
          done

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # PRD-0008 D3 / N6. Runs FIRST and needs no toolchain: if the binary would
      # carry payment copy, there is no point spending five minutes building it.
      - name: Payment-string gate (PRD-0008 D3)
        run: ./scripts/check-no-payment-strings.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP downloads the compileSdk platform on demand once licences are
      # accepted (the step above does that). Pinning a `platforms;android-XX`
      # package id here would have to be edited every time the catalog moves.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
