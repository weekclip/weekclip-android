# Version catalog — single source of truth for dependency versions.
# Resolved from Maven metadata on 2026-08-14; every entry is the latest STABLE
# release at that date (alpha/beta/rc deliberately excluded — see ADR-0002 D2,
# which rejected Navigation 3 for exactly this reason).

[versions]
# Build
agp = "9.3.1"                  # 9.4.0 is alpha
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"

# SDK levels — local SDK has platform android-37.0 (Android 17)
compile-sdk = "37"
target-sdk = "37"
min-sdk = "28"

# AndroidX
core-ktx = "1.19.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation-compose = "2.9.8"   # Navigation 2 — ADR-0002 D2
hilt-navigation-compose = "1.4.0"
work = "2.11.2"
datastore = "1.2.1"
# Custom Tabs, for the Google sign-in round trip (#148 / 148.5c-b). Checked the
# way security-crypto taught us to: 9 of ~178 public members in
# CustomTabsIntent.java carry @Deprecated in the 1.10.0 sources, and neither
# `Builder()` nor `launchUrl` is among them. Ordinary attrition, not a
# deprecated-on-arrival release.
browser = "1.10.0"
# androidx.security:security-crypto is deliberately absent. Its 1.1.0 release —
# the "latest stable" this catalog originally pinned — deprecates its ENTIRE
# public API (EncryptedSharedPreferences, MasterKey, MasterKeys, EncryptedFile
# all carry @Deprecated in the 1.1.0 sources). The javadoc points at
# javax.crypto.KeyGenerator with AndroidKeyStore, which is what
# core/session/AndroidKeystoreCipher.kt does directly. #148 / 148.5.

# Compose
compose-bom = "2026.08.00"

# Images — every media surface in the inventory renders a remote poster
# (posterUrl / posterThumbUrl on StudioMediaItem), so this is load-bearing
# rather than a convenience.
coil = "3.5.0"

# Playback — Media3/ExoPlayer is effectively mandatory (ADR-0002 D5):
# the platform MediaPlayer's HLS support is not production-usable.
media3 = "1.11.0"

# Networking — ADR-0002 D6
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"

# Testing
junit = "4.13.2"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle lives here, NOT in lifecycle-runtime-ktx. Without
# it the only way to read a StateFlow in Compose is collectAsState(), which
# keeps collecting while the app is backgrounded.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
# hiltViewModel(). Hilt itself cannot construct a ViewModel for a NavBackStackEntry.
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# The system browser, in-app. RFC 8252 §8.12 rules out a WebView for OAuth and
# Google enforces it (`disallowed_useragent`); this is the sanctioned way to
# stay visually inside the app while the browser owns the page and the cookies.
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# Coil 3 ships no network fetcher by default. Routing it through the same OkHttp
# instance means one connection pool and one place to add auth headers.
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# Exercises Retrofit + the kotlinx-serialization converter against real bytes
# over a real socket. A hand-written fake of the API interface would skip
# exactly the layer most likely to be wrong: the wire envelope.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
