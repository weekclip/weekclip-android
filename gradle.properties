# Project-wide Gradle settings.
#
# NOTE: the previous file carried `-XX:MaxPermSize=512m`, a Java 7 flag that was
# REMOVED in Java 8 — any modern JDK refuses to start the daemon with it. It also
# declared `android.enableBuildFeatures` / `android.enableNamespacing`, which are
# not AGP properties at all. Both were part of why CI never went green (#148).

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
